name: core

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest r2pipe
      - name: Install radare2 where the OS packages it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2 build-essential
      - name: Run the core tests
        run: python -m pytest -q --tb=line
      - name: Require the committed test id set
        run: python tools/check_collection_floor.py
